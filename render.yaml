# Render blueprint: the web service and the worker, both on the free tier.
#
# Postgres is NOT defined here on purpose. Render's free Postgres expires after
# 30 days; Neon's free tier does not, so the database lives there and both
# services read MEMENTO_DATABASE_URL from a shared environment group.
#
# Setup:
#   1. Create a Neon project (neon.tech) and copy its DIRECT connection string --
#      NOT the -pooler one. PgBouncer in transaction mode does not support
#      LISTEN/NOTIFY, which the SSE progress stream depends on.
#   2. In Render: New > Blueprint, point it at this repo.
#   3. Create an env group named "memento-db" with MEMENTO_DATABASE_URL set to
#      that connection string.
services:
  # Serves the React app and the API from one image, so there is one origin and
  # no CORS to configure.
  - type: web
    name: memento
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: MEMENTO_PORT
        value: "8080"
      # Each SSE stream holds a connection for LISTEN, so keep the pool small
      # against a free-tier database.
      - key: MEMENTO_DB_MAX_CONNS
        value: "5"
      # Points at the worker so enqueueing a job wakes it. On the free tier an
      # idle service is stopped, and an HTTP request is what starts it -- without
      # this a job would sit queued until the worker's own poll timer fired.
      - key: MEMENTO_WORKER_HEALTH_URL
        value: https://memento-worker.onrender.com/healthz
      - fromGroup: memento-db

  # The worker runs as a web service rather than a background worker because
  # Render's background workers are a paid feature, and because the health
  # endpoint is what makes it wakeable.
  - type: web
    name: memento-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: MEMENTO_WORKER_PORT
        value: "8081"
      - key: MEMENTO_DB_MAX_CONNS
        value: "4"
      # Paginated profile pages are the most aggressively gated URLs on the site,
      # and a shared host IP arrives with reputation we do not control. Measured
      # from this deploy: 2 concurrent at 2s still got blocked on grid page 3, so
      # the index phase runs strictly serially with a long gap. A large profile
      # then takes minutes to index, which is the right trade -- a slow scrape
      # beats a failed one, and the shared film cache means it happens once.
      - key: MEMENTO_INDEX_CONCURRENCY
        value: "1"
      - key: MEMENTO_INDEX_INTERVAL_MS
        value: "6000"
      # Film detail pages are a different story from profile pages: they sit in
      # Cloudflare's edge cache and measured clean at 16 concurrent in ~281ms with
      # zero blocks. Throttling them as hard as the profile pages was a mistake --
      # it made an export import (which never touches the gated URLs at all) take
      # over an hour for a large library.
      - key: MEMENTO_DETAIL_CONCURRENCY
        value: "12"
      - key: MEMENTO_DETAIL_INTERVAL_MS
        value: "100"
      - fromGroup: memento-db
